services:
  - type: web
    name: sara-ai-api
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker sara_ai.app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: REDIS_URL
        value: redis://sara-ai-redis:6379/0
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: production

  - type: worker
    name: sara-ai-worker
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: celery -A sara_ai.celery_app.celery worker --pool=solo --loglevel=info
    envVars:
      - key: REDIS_URL
        value: redis://sara-ai-redis:6379/0
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: production

databases:
  - name: sara-ai-redis
    plan: free
    region: oregon
